<style>
  #cookieBanner {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 16px;
    border-radius: 12px;
    display: none;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #cookieBanner p {
    margin: 0;
    flex: 1;
    min-width: 200px;
  }
  #cookieBanner button {
    padding: 8px 14px;
    margin-left: 8px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 500;
  }
  #cookieBanner .accept {
    background: #2d9cdb;
    color: white;
  }
  #cookieBanner .decline {
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,.3);
  }
</style>

<div id="cookieBanner">
  <p>
    Používame Meta Pixel na zlepšenie obsahu a analýzu návštevnosti.
    Súhlasíte so spracovaním údajov pre analytické účely?
  </p>
  <div>
    <button class="decline" id="cookieDecline">Nesúhlasím</button>
    <button class="accept" id="cookieAccept">Súhlasím</button>
  </div>
</div>

<script>
  // Meta Pixel loader
  function loadMetaPixel(pixelId) {
    if (!pixelId) return;
    if (window.fbq && window.fbq.loaded) return;

    !(function(f,b,e,v,n,t,s){
      if(f.fbq) return;
      n=f.fbq=function(){ n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments); };
      if(!f._fbq) f._fbq=n;
      n.push = n;
      n.loaded = !0;
      n.version = '2.0';
      n.queue = [];
      t=b.createElement(e); t.async=true;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    window.fbq('init', pixelId);
    window.fbq('track', 'PageView');
    console.log("✅ Meta Pixel inicializovaný:", pixelId);
  }

  // helpers
  function saveConsent(consent) {
    try {
      localStorage.setItem('cookie_consent_meta', consent ? 'yes' : 'no');
    } catch(e) {}
  }
  function hasConsent() {
    try {
      return localStorage.getItem('cookie_consent_meta') === 'yes';
    } catch(e) { return false; }
  }

  (function(){
    const PIXEL_ID = '206276089904081';
    const banner = document.getElementById('cookieBanner');
    const accept = document.getElementById('cookieAccept');
    const decline = document.getElementById('cookieDecline');

    if (hasConsent()) {
      loadMetaPixel(PIXEL_ID);
      return; // už súhlasil, netreba banner
    }

    banner.style.display = 'flex';

    accept.addEventListener('click', function(){
      saveConsent(true);
      loadMetaPixel(PIXEL_ID);
      banner.style.display = 'none';
    });

    decline.addEventListener('click', function(){
      saveConsent(false);
      banner.style.display = 'none';
    });
  })();
</script>
